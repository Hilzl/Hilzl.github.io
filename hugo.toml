baseURL = 'https://Hilzl.github.io/'
defaultContentLanguage = 'zh'
title = '我的博客'
theme = 'PaperMod'
[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = '记录想法与生活中的美好瞬间'
  author = 'Hilzl'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true
  comments = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Hilzl'

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

[params.editPost]
  URL = 'https://github.com/Hilzl/Hilzl.github.io/edit/main/content'
  Text = '编辑本文'
  appendFilePath = true

[params.assets]
  disableHLJS = false

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 30
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 40
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 50

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[[menu.main]]
  name = '照片'
  url = '/photos/'
  weight = 15

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
